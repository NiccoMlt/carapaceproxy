name: Maven release

on:
  workflow_dispatch:
    inputs:
      bump:
        required: true
        description: 'major and minor cut a release branch from master, hotfix releases the release/* branch it runs on'
        type: choice
        options:
          - major
          - minor
          - hotfix
        default: minor

# a release pushes commits, tags and packages: one at a time, never cancelled halfway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  release:
    name: 'Perform ${{ inputs.bump }} release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Generate GitHub App token'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: 'Checkout ${{ github.ref_name }} branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: 'Set up JDK 21'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: 'Configure Git'
        uses: ./.github/actions/configure-git
        with:
          token: ${{ steps.app-token.outputs.token }}

      - id: compute_versions
        name: 'Compute versions and branch name'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-SNAPSHOT$ ]]; then
            echo "::error::Cannot release '${version}': expected MAJOR.MINOR.PATCH-SNAPSHOT"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          case "$BUMP" in
          hotfix)
            branch_name="release/${major}.${minor}"
            release_version="${major}.${minor}.${patch}"
            release_development_version="${major}.${minor}.$((patch + 1))-SNAPSHOT"
            # master_development_version is not needed: a hotfix runs on the release branch and leaves master alone
            ;;
          major)
            branch_name="release/$((major + 1)).0"
            release_version="$((major + 1)).0.0"
            release_development_version="$((major + 1)).0.1-SNAPSHOT"
            master_development_version="$((major + 1)).1.0-SNAPSHOT"
            ;;
          minor)
            branch_name="release/${major}.${minor}"
            release_version="${major}.${minor}.0"
            release_development_version="${major}.${minor}.1-SNAPSHOT"
            master_development_version="${major}.$((minor + 1)).0-SNAPSHOT"
            ;;
          esac
          tag="v${release_version}"

          if [ "$BUMP" = hotfix ]; then
            if [ "$GITHUB_REF_NAME" != "$branch_name" ]; then
              echo "::error::A hotfix of ${version} must run on ${branch_name}, not on ${GITHUB_REF_NAME}"
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != master ]; then
              echo "::error::A ${BUMP} release must run on master, not on ${GITHUB_REF_NAME}"
              exit 1
            fi
            if git show-ref --verify --quiet "refs/remotes/origin/${branch_name}"; then
              echo "::error::Branch ${branch_name} already exists"
              exit 1
            fi
          fi

          {
            echo "branch_name=${branch_name}"
            echo "tag=${tag}"
            echo "release_version=${release_version}"
            echo "release_development_version=${release_development_version}"
            echo "master_development_version=${master_development_version}"
          } >> "$GITHUB_OUTPUT"

      - if: ${{ inputs.bump != 'hotfix' }}
        name: 'Create release branch ${{ steps.compute_versions.outputs.branch_name }}'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ./mvnw release:clean release:branch \
              -DbranchName=${{ steps.compute_versions.outputs.branch_name }} \
              -DdevelopmentVersion=${{ steps.compute_versions.outputs.master_development_version }}

      # the Git identity and the gh credential helper configured above survive this checkout
      - if: ${{ inputs.bump != 'hotfix' }}
        name: 'Checkout release branch ${{ steps.compute_versions.outputs.branch_name }}'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.compute_versions.outputs.branch_name }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: 'Prepare release ${{ steps.compute_versions.outputs.release_version }} on ${{ steps.compute_versions.outputs.branch_name }}'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ./mvnw release:clean release:prepare \
              -DreleaseVersion=${{ steps.compute_versions.outputs.release_version }} \
              -DdevelopmentVersion=${{ steps.compute_versions.outputs.release_development_version }} \
              -Dtag=${{ steps.compute_versions.outputs.tag }}

      - name: 'Perform release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw release:perform

      - name: 'Create GitHub Release ${{ steps.compute_versions.outputs.tag }}'
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.compute_versions.outputs.tag }}
          name: Release ${{ steps.compute_versions.outputs.release_version }}
          # latest = highest version, so a hotfix of an older minor does not outrank the current one
          make_latest: legacy
          fail_on_unmatched_files: true
          files: |
            target/checkout/carapace-server/target/carapace-server-*.jar
            target/checkout/carapace-server/target/carapace-server-*.zip
